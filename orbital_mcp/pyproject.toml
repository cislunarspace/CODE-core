[project]
name = "orbital-mcp"
version = "0.1.0"
description = "MCP server for orbital mechanics calculations using e2m2e library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "e2m2e>=3.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.scripts]
orbital-mcp = "orbital_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.mcp]
server_name = "orbital-mcp"
server_description = "MCP server for orbital mechanics - DRO, RO, CR3BP dynamics calculations"
