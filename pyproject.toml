[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "e2m2e"
version = "4.1.0"
description = "Earth to Moon, Moon to Earth — 地月空间转移轨道设计库"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "ouyangjiahong", email = "ouyangjiahong22@nudt.edu.cn"},
]
keywords = [
    "astrodynamics",
    "orbital mechanics",
    "CR3BP",
    "three-body problem",
    "transfer orbit",
    "earth-moon",
    "cislunar",
    "trajectory design",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "spiceypy>=8.1.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/cislunarspace/e2m2e"
Repository = "https://github.com/cislunarspace/e2m2e"
Issues = "https://github.com/cislunarspace/e2m2e/issues"

[tool.hatch.build.targets.wheel]
packages = ["e2m2e"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["e2m2e"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy",
]
