[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "e2m2e"
version = "5.3.1"
description = "Earth to Moon, Moon to Earth — 地月空间转移轨道设计库"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "ouyangjiahong", email = "ouyangjiahong22@nudt.edu.cn"},
]
keywords = [
    "astrodynamics",
    "orbital mechanics",
    "CR3BP",
    "three-body problem",
    "transfer orbit",
    "earth-moon",
    "cislunar",
    "trajectory design",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tqdm>=4.66",
    "spiceypy>=8.1.0",
    "pydantic>=2.0",
    "pyerfa>=2.0.1.5",
    "r2s2>=0.1.0",
]

[project.optional-dependencies]
# 标准形化简流水线（normal-form 切片）所需的符号计算与并行工具，
# 在化简器内部惰性导入，不阻塞基础 ``e2m2e.algorithms`` 加载。
normal-form = [
    "sympy>=1.12",
    "joblib>=1.3",
]
# 可视化（tools/viz）：核心库不依赖 matplotlib（ADR 0011，MCP 无头部署
# 不需要）。
viz = [
    "matplotlib>=3.7",
]
# MCP 协议层（api/mcp）：部署 MCP 服务器时装。
mcp = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/cislunarspace/e2m2e"
Repository = "https://github.com/cislunarspace/e2m2e"
Issues = "https://github.com/cislunarspace/e2m2e/issues"

[tool.maturin]
manifest-path = "crates/e2m2e-integrators/Cargo.toml"
module-name = "e2m2e._integrators"
python-source = "."

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 tests/kernel_helpers.py 在 xdist worker 中可导入
pythonpath = ["tests"]
markers = [
    "slow: 运行时间较长的数值测试",
    "spice: 依赖 SPICE 内核的测试，内核缺失时跳过",
    "e2e: 依赖 DFH_DAC.exe 的端到端测试，exe 缺失时跳过",
]

[tool.coverage.run]
source = ["e2m2e"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 55

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.1",
    "mypy",
    "maturin>=1.0",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinxcontrib-mermaid>=0.9",
    "sphinx-copybutton>=0.5",
]
