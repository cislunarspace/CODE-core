<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536" height="400" viewBox="0 0 1536 400"
     font-family="Noto Sans CJK SC, Noto Sans, DejaVu Sans, sans-serif">
  <!--
    README 横幅母版（1536×400）。右侧三行文字统一右对齐到 x=1432，
    与左侧标志的左边距 104 对称。改文案或配色后重跑 tools/assets/build-assets.mjs。
    标志取自本仓库 docs/_static/logo.png，本目录同名文件即其副本。
  -->
  <rect width="1536" height="400" fill="#ffffff"/>

  <image x="104" y="64" width="272" height="272" xlink:href="logo.png"/>

  <g text-anchor="end" fill="#16213e">
    <text x="1432" y="170" font-size="92" font-weight="700" letter-spacing="2">e2m2e</text>
    <text x="1432" y="246" font-size="34" fill="#3d5a80">Earth to Moon, Moon to Earth</text>
  </g>
  <text x="1432" y="306" font-size="30" text-anchor="end" fill="#7d8899">地月空间轨道设计与转移算法库</text>
</svg>
