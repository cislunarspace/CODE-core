[package]
name = "e2m2e-spice"
version.workspace = true
edition = "2021"
description = "SPICE FFI bindings for e2m2e"

[lib]
name = "e2m2e_spice"
crate-type = ["rlib"]

[features]
default = []
spice = ["dep:cspice", "dep:cspice-sys"]

[dependencies]
cspice = { workspace = true, optional = true }
cspice-sys = { workspace = true, optional = true }
