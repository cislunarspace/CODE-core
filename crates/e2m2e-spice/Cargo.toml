[package]
name = "e2m2e-spice"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "SPICE FFI bindings for e2m2e"

[lib]
name = "e2m2e_spice"
crate-type = ["rlib"]

[features]
# spice 默认开启：本 crate 即 SPICE FFI 绑定，无 spice feature 则为空壳。
# 与 workspace 其余 crate 的 default=["spice"] 对齐。CSPICE 由
# scripts/download_cspice.py 提供（CSPICE_DIR）。
default = ["spice"]
spice = ["dep:cspice-rs", "dep:cspice-rs-sys"]

[dependencies]
cspice-rs = { workspace = true, optional = true }
cspice-rs-sys = { workspace = true, optional = true }
