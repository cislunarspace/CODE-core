[package]
name = "e2m2e-integrators"
version.workspace = true
edition = "2021"

[lib]
name = "e2m2e_integrators"
crate-type = ["cdylib", "rlib"]

[features]
default = []
spice = ["dep:cspice", "dep:cspice-sys", "e2m2e-forces/spice", "e2m2e-spice/spice"]

[dependencies]
pyo3 = { workspace = true }
rayon = { workspace = true }
e2m2e-forces = { path = "../e2m2e-forces" }
e2m2e-propagation = { path = "../e2m2e-propagation", features = ["pyo3"] }
e2m2e-spice = { path = "../e2m2e-spice" }
cspice = { workspace = true, optional = true }
cspice-sys = { workspace = true, optional = true }
# 进度回调 drainer：FFI 创建 (tx, rx) 对，rx 由独立 OS 线程排空，
# reacquire GIL 调 Python callable；tx 传给 e2m2e-forces 的并行内核。
crossbeam-channel = { workspace = true }
