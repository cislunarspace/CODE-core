[package]
name = "e2m2e-integrators"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "PyO3 bindings for e2m2e (propagation, forces, spice)"

[lib]
name = "e2m2e_integrators"
crate-type = ["cdylib", "rlib"]

[features]
# spice 默认开启：STM 传播/多重打靶/受控动力学等 Rust 快速路径均依赖 CSPICE，
# 普通构建（cargo build / maturin develop）必须含 spice，不再产无 spice 子集。
# CSPICE 经 scripts/download_cspice.py 从 cspice-v1 release 取预编译包（设 CSPICE_DIR）；
# 无 CSPICE_DIR 时构建直接报错（不启用 downloadcspice，杜绝走 NAIF 源码下载）。见 Makefile / README。
default = ["spice"]
# 仅 cdylib（maturin）构建启用：pyo3 的 extension-module 使产物不链接
# libpython（宿主解释器提供符号）。cargo test 不启用该 feature，pyo3
# 自动链接 libpython，测试二进制可独立运行。pyproject [tool.maturin]
# features 显式传入。
extension-module = ["pyo3/extension-module"]
spice = ["dep:cspice", "dep:cspice-sys", "e2m2e-forces/spice", "e2m2e-spice/spice", "e2m2e-hjb-dynamics/ephemeris"]

[dependencies]
pyo3 = { workspace = true }
rayon = { workspace = true }
e2m2e-forces = { path = "../e2m2e-forces" }
e2m2e-levelset = { path = "../e2m2e-levelset" }
e2m2e-hjb-dynamics = { path = "../e2m2e-hjb-dynamics", default-features = false }
ndarray = { workspace = true }
e2m2e-propagation = { path = "../e2m2e-propagation", features = ["pyo3"] }
e2m2e-spice = { path = "../e2m2e-spice" }
cspice = { workspace = true, optional = true }
cspice-sys = { workspace = true, optional = true }
# 进度回调 drainer：FFI 创建 (tx, rx) 对，rx 由独立 OS 线程排空，
# reacquire GIL 调 Python callable；tx 传给 e2m2e-forces 的并行内核。
crossbeam-channel = { workspace = true }
nalgebra = { workspace = true }
# 中心流形频域 W 求解器（#466）：与 numpy.fft 同语义的特解 FFT。
rustfft = "6.4"
num-complex = "0.4"
