[package]
name = "e2m2e-integrators"
version = "0.1.0"
edition = "2021"

[lib]
name = "e2m2e_integrators"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 启用 cspice Rust 绑定（NAIF CSPICE C 库），用于 SecondBodyGravity / 坐标变换
# 等下沉路径的 SPICE 查询。与 qiao 仓库的 cspice 用法（ephfunc/moon_param.rs）
# 一致。
spice = ["dep:cspice", "dep:cspice-sys"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
cspice = { version = "0.1", optional = true }
cspice-sys = { version = "1.0", optional = true }
