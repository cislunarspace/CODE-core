[package]
name = "e2m2e-forces"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Force models for e2m2e (N-body, gravity field, STM)"

[lib]
name = "e2m2e_forces"
crate-type = ["rlib"]

[features]
# spice 默认开启：drag/星历等力模型依赖 CSPICE FFI，与 e2m2e-integrators 的
# default=["spice"] 对齐（见该 crate 注释）。单独 cargo build -p e2m2e-forces
# 也带 spice。CSPICE 由 scripts/download_cspice.py 提供（CSPICE_DIR）。
default = ["spice"]
spice = [
    "dep:cspice-rs",
    "dep:e2m2e-spice",
    "e2m2e-spice/spice",
]

[dependencies]
e2m2e-spice = { path = "../e2m2e-spice", optional = true }
# 无条件依赖：cr3bp 模块（顶层非门控）复用其 explicit_rk_step / RkMethod。
# e2m2e-propagation 纯数学，不引入 spice 链路。
e2m2e-propagation = { path = "../e2m2e-propagation" }
cspice-rs = { workspace = true, optional = true }
