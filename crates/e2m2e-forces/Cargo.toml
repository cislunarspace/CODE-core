[package]
name = "e2m2e-forces"
version.workspace = true
edition = "2021"
description = "Force models for e2m2e (N-body, gravity field, STM)"

[lib]
name = "e2m2e_forces"
crate-type = ["rlib"]

[features]
default = []
spice = [
    "dep:cspice",
    "dep:e2m2e-spice",
    "dep:e2m2e-propagation",
    "e2m2e-spice/spice",
]

[dependencies]
e2m2e-spice = { path = "../e2m2e-spice", optional = true }
e2m2e-propagation = { path = "../e2m2e-propagation", optional = true }
cspice = { workspace = true, optional = true }
