[package]
name = "e2m2e-forces"
version = "0.1.0"
edition = "2021"
description = "Force models for e2m2e (N-body, gravity field, SRP, STM)"

[lib]
name = "e2m2e_forces"
crate-type = ["cdylib", "rlib"]

[features]
default = []
spice = ["dep:cspice", "e2m2e-spice/spice"]

[dependencies]
pyo3 = { workspace = true }
e2m2e-spice = { path = "../e2m2e-spice" }
e2m2e-propagation = { path = "../e2m2e-propagation" }
cspice = { workspace = true, optional = true }
