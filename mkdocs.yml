site_name: E2M2E Documentation
site_description: Earth-to-Moon-to-Earth (E2M2E) 轨道力学库文档
site_author: E2M2E Team

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

nav:
  - 首页: index.md
  - 做这些事:
    - 设计周期轨道: guides/orbit-generation.md
    - 分析轨道稳定性: algorithms/stability.md
    - 可视化轨道: guides/visualization-guide.md
  - 深入了解:
    - 系统定义: core/system.md
    - 动力学积分: core/dynamics.md
    - 轨道数据: core/orbit.md
    - 微分修正: algorithms/differential_correction.md
    - 轨道族延拓: algorithms/continuation.md
    - Halo 轨道: algorithms/halo.md
    - 稳定性分析: algorithms/stability.md
  - 技术参考:
    - API 参考: reference/api-reference.md
    - 算法细节: reference/algorithms.md
  - MBSE 模型:
    - 系统总览: mbse/system-overview.md
    - 需求追溯矩阵: mbse/traceability-matrix.md
    - Core 层 BDD: mbse/bdd-core.md
    - Algorithms 层 BDD: mbse/bdd-algorithms.md
    - 需求定义: mbse/requirements.md
    - 收敛状态机: mbse/state-convergence.md
    - 轨道生命周期: mbse/state-orbit-lifecycle.md
    - 轨道设计活动图: mbse/activity-orbit-design.md
    - 微分修正活动图: mbse/activity-differential-correction.md
    - 传播序列图: mbse/sequence-propagation.md
    - 修正序列图: mbse/sequence-correction.md
  - 其他:
    - 坐标变换: core/coordinate.md
    - 星历系统: core/ephemeris_system.md
    - 星历动力学: core/ephemeris_dynamics.md
    - SPICE 管理: core/spice.md
    - 多重打靶法: algorithms/multiple_shooting.md
    - 系统总览: guides/system-overview.md
    - 可视化模块: visualization/plotting.md
    - 发布指南: guides/release.md
  - English Documentation:
    - Home: index_en.md
    - Getting Started:
      - Design Periodic Orbits: guides/orbit-generation_en.md
      - Analyze Stability: algorithms/stability_en.md
      - Visualize Orbits: guides/visualization-guide_en.md
    - Deep Dive:
      - System Definition: core/system_en.md
      - Dynamics: core/dynamics_en.md
      - Orbit Data: core/orbit_en.md
      - Differential Correction: algorithms/differential_correction_en.md
      - Continuation: algorithms/continuation_en.md
      - Halo Orbit: algorithms/halo_en.md
      - Stability Analysis: algorithms/stability_en.md
    - Reference:
      - API Reference: reference/api-reference_en.md
      - Algorithm Details: reference/algorithms_en.md
    - Other:
      - Coordinate Transformation: core/coordinate_en.md
      - System Overview: guides/system-overview_en.md
      - Plotting Module: visualization/plotting_en.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
