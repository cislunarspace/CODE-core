# 构建 calcephpy 的 Windows + Linux 预编译 wheel，发布到 calcephpy-v1 release。
#
# 背景：PyPI 上 calcephpy==5.0.0 只有 sdist，Windows 安装须现场编译
# （cmake + MSVC）、Linux 安装须现场编译（cmake + gcc），开发者 clone
# e2m2e / transfer-orbit-design 后 uv sync 常因缺编译器失败。e2m2e 经 r2s2
# 传递依赖 calcephpy，故 wheel 发到本仓库，两个下游仓库的 [tool.uv] find-links
# 指向此 release 即可免编译。
#
# calcephpy 是 IMCCE/CNRS 的 CALCEPH 库的 Python 绑定（CeCILL-C/B 或
# CeCILL v2.1 许可），版权归 IMCCE；此处仅提供预编译二进制便利，不修改
# 上游源码。触发：手动（Actions → Run workflow），或修改本 workflow 时自动。

name: Build calcephpy wheels

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/calcephpy-wheel.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 e2m2e 声明支持的 Python 3.10–3.13；下游 transfer-orbit-design
        # 要求 >=3.13，亦在此范围内。calcephpy 5.0.0 的 Cython 扩展每个
        # CPython 次版本 ABI 不同，须逐版本编译。
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Show toolchain
        shell: pwsh
        run: |
          python --version
          cmake --version
      # --no-deps：只构建 calcephpy 本身的 wheel，不去构建 runtime 声明的
      # numpy/cython/setuptools。PEP 517 隔离环境自动装 build-system.requires
      # （setuptools + cython）。setup.py 把 PYTHON=sys.executable 传给 cmake
      # 的 find_package(Python)，故 matrix 里 setup-python 装的版本即编译版本。
      - name: Build wheel
        run: pip wheel calcephpy==5.0.0 --no-deps -w wheelhouse/
      - name: Smoke test（安装并 import）
        shell: pwsh
        run: |
          # calcephpy 的 install_requires 误把 cython/setuptools 当 runtime
          # 依赖（实为构建期），--no-deps 只装 wheel 本身验证；numpy 是真 runtime 依赖，预装。
          pip install numpy
          pip install --no-deps --no-index --find-links wheelhouse/ calcephpy
          python -c "import calcephpy; print('calcephpy import OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-py${{ matrix.python }}
          path: wheelhouse/*.whl

  # Linux wheel：manylinux_2_28 镜像自带 cmake+gcc 与 uv。用 uv 安装完整版
  # CPython（python-build-standalone 自带 include + libpython.so），因为镜像
  # 自带的 /opt/python/* 是 stripped 版、缺 libpython，无法满足 calcephpy 的
  # cmake find_package(Python Development)。构建后经 auditwheel 打 manylinux
  # 标签并校验合规性。
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      # uv python install 装的完整 CPython 的 bin 目录（安装后取真实路径）
      PY_VER: ${{ matrix.python }}
    steps:
      - name: Show toolchain
        run: |
          cmake --version
          uv --version
      - name: 安装完整版 CPython（含 libpython 开发文件）
        run: |
          set -eux
          uv python install ${PY_VER}
          # uv python find 返回的是 python 可执行文件完整路径（.../bin/python3.x）
          echo "PY=$(uv python find ${PY_VER})" >> "$GITHUB_ENV"
          echo "PYROOT=$(dirname "$(dirname "$(uv python find ${PY_VER})")")" >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          set -eux
          ${PY} -m venv /tmp/v
          /tmp/v/bin/pip install --no-cache-dir setuptools cython wheel
          # Python_EXECUTABLE + Python_ROOT_DIR：让 cmake 找到完整 CPython 的
          # include/libpython（stripped 的 /opt/python 找不到）。
          export Python_EXECUTABLE=$PY
          export Python_ROOT_DIR=$PYROOT
          /tmp/v/bin/pip wheel calcephpy==5.0.0 --no-deps --no-build-isolation -w /tmp/wheelhouse/
      - name: auditwheel repair（打 manylinux 标签并校验合规性）
        run: |
          set -eux
          auditwheel repair -w /tmp/repaired /tmp/wheelhouse/*.whl
          ls -la /tmp/repaired/
      - name: Smoke test（安装并 import）
        run: |
          set -eux
          /tmp/v/bin/pip install numpy
          /tmp/v/bin/pip install --no-deps --no-index --find-links /tmp/repaired/ calcephpy
          /tmp/v/bin/python -c "import calcephpy; print('calcephpy import OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.python }}
          path: /tmp/repaired/*.whl

  # Linux aarch64 wheel：与 build-linux 同逻辑，但跑在 GitHub 原生 arm64
  # runner + manylinux_2_28_aarch64 容器（quay.io/pypa 官方镜像，自带
  # cmake+gcc+uv）。e2m2e 支持 aarch64 后，arm 用户经 [tool.uv.sources]
  # 直接拉预编译 wheel，免现场编译。
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64
    env:
      # uv python install 装的完整 CPython 的 bin 目录（安装后取真实路径）
      PY_VER: ${{ matrix.python }}
    steps:
      - name: Show toolchain
        run: |
          cmake --version
          uv --version
      - name: 安装完整版 CPython（含 libpython 开发文件）
        run: |
          set -eux
          uv python install ${PY_VER}
          # uv python find 返回的是 python 可执行文件完整路径（.../bin/python3.x）
          echo "PY=$(uv python find ${PY_VER})" >> "$GITHUB_ENV"
          echo "PYROOT=$(dirname "$(dirname "$(uv python find ${PY_VER})")")" >> "$GITHUB_ENV"
      - name: Build wheel
        run: |
          set -eux
          ${PY} -m venv /tmp/v
          /tmp/v/bin/pip install --no-cache-dir setuptools cython wheel
          # Python_EXECUTABLE + Python_ROOT_DIR：让 cmake 找到完整 CPython 的
          # include/libpython（stripped 的 /opt/python 找不到）。
          export Python_EXECUTABLE=$PY
          export Python_ROOT_DIR=$PYROOT
          /tmp/v/bin/pip wheel calcephpy==5.0.0 --no-deps --no-build-isolation -w /tmp/wheelhouse/
      - name: auditwheel repair（打 manylinux 标签并校验合规性）
        run: |
          set -eux
          auditwheel repair -w /tmp/repaired /tmp/wheelhouse/*.whl
          ls -la /tmp/repaired/
      - name: Smoke test（安装并 import）
        run: |
          set -eux
          /tmp/v/bin/pip install numpy
          /tmp/v/bin/pip install --no-deps --no-index --find-links /tmp/repaired/ calcephpy
          /tmp/v/bin/python -c "import calcephpy; print('calcephpy import OK')"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-aarch64-${{ matrix.python }}
          path: /tmp/repaired/*.whl

  release:
    needs: [build, build-linux, build-linux-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: List wheels
        run: ls -la dist/
      - name: Upload to calcephpy-v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release 不存在则创建（tag 指向 master HEAD）；已存在则跳过创建。
          # upload --clobber 覆盖同名 asset，保证重跑幂等。
          gh release create calcephpy-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "calcephpy 预编译 wheel（Windows + Linux x86_64 + Linux aarch64）" \
            --notes "calcephpy 5.0.0 的预编译 wheel：Windows（cp310–cp313，win_amd64）+ Linux x86_64（cp310–cp313，manylinux_2_28_x86_64）+ Linux aarch64（cp310–cp313，manylinux_2_28_aarch64）。PyPI 仅有 sdist，Windows 需 MSVC、Linux 需 gcc 现场编译；此处提供预编译产物，供 e2m2e / transfer-orbit-design 的 uv sync 经 find-links 直接拉取。calcephpy 归 IMCCE/CNRS，CeCILL-C/B 或 CeCILL v2.1 许可。" \
            || true
          gh release upload calcephpy-v1 dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber

