name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # lint 只需 ruff，不装项目本体：uv sync 构建 editable 会编译 cspice-sys，
      # 未设 CSPICE_DIR 直接报错（v5.6.6 起 CSPICE 只从 GitHub release 取
      # 预编译包）。后续 uv run 加 --no-sync 防止触发重新同步。
      - run: uv sync --group dev --no-install-project
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: astral-sh/setup-uv@v7
      # spice 为默认 feature：cargo test --workspace 编译并跑 spice-gated 代码，
      # 须先下 CSPICE 编译包（CSPICE_DIR）与 SPICE 内核（kernels/）。
      - name: 下载 SPICE 编译包（cspice-v1 release）
        # --no-sync：脚本只用标准库；uv run 默认先 sync 构建扩展，此时
        # CSPICE_DIR 未设、cspice-sys 直接报错（鸡生蛋，同 ci.yml）。
        run: uv run --no-sync python scripts/download_cspice.py >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 下载 SPICE 内核（kernels-v1 release）
        run: uv run --no-sync python scripts/download_kernels.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # cargo 编译缓存：cargo test 全量 debug 编译约 40s → 增量。key 含 job id
      # 与 OS/arch（rust-cache 默认），与 clippy 缓存天然隔离（check 产物对
      # codegen 无用，混用无收益）。
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: CSPICE_DIR
      # --test-threads=1：CSPICE 全局线程锁，spice-gated 测试串行避免竞争。
      # spice 默认开启后单趟 cargo test --workspace 即覆盖原 forces 单独 spice 趟。
      - run: cargo test --workspace -- --test-threads=1

  build:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Windows runner 上 Microsoft Store 的 python3 存根（App Execution Alias）
      # 会抢先解析到 WindowsApps\python3.EXE，maturin 探 Python 解释器时撞
      # EACCES。锁定 setup-python 装到的真实解释器并前置到 PATH。
      - name: Pin real Python on PATH (windows MS Store stub workaround)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          $realPy = (py -3 -c "import sys; print(sys.executable)")
          Write-Host "Real Python: $realPy"
          "python=$realPy" | Out-File -Append $env:GITHUB_ENV
          $dir = Split-Path $realPy
          $env:Path = "$dir;$env:Path"
          "PATH=$dir;$env:Path" | Out-File -Append $env:GITHUB_ENV
      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PY_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != pyproject.toml version ($PY_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
      # manylinux 2014 (CentOS 7) 的 openssl 1.0.2 没有 openssl.pc；
      # cspice-sys 1.0.4 的 downloadcspice 走 reqwest→native-tls→openssl-sys，
      # 找不到 pkg-config 文件而失败。manylinux_2_28 镜像自带 openssl 1.1.1
      # 与 openssl-devel（含 openssl.pc），加上 before-script 兜底安装。
      # SPICE 编译包来自 cspice-v1 release（scripts/download_cspice.py 按
      # runner 架构自动选 x86_64/aarch64 资产），设好 CSPICE_DIR 后 cspice-sys
      # 跳过 NAIF 下载（国内网络常不可达）。aarch64 条目跑在原生 arm64 runner
      # （ubuntu-24.04-arm），maturin-action 自动用 manylinux_2_28_aarch64 容器，
      # 无交叉工具链问题；CSPICE aarch64 库由 cspice-aarch64-build.yml 维护。
      - name: 下载 SPICE 编译包（cspice-v1 release）
        shell: bash
        run: python scripts/download_cspice.py >> "$GITHUB_ENV"
      # cargo 编译缓存：wheel release 全量编译（linux 容器内 6min / windows 2min）
      # → 增量。linux 经 maturin-action 容器构建，workspace（含 target/）同路径
      # 挂载进容器，host 侧的缓存恢复/保存对容器内构建生效；key 默认含 OS/arch，
      # x86_64、aarch64、windows 三平台天然隔离。容器内 $CARGO_HOME（registry）
      # 与 host 不共享，依赖源码仍每次下载（约 20s，不重编）。
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: CSPICE_DIR
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          # spice 为默认 feature（crates/*/Cargo.toml default=["spice"]，pyproject
          # [tool.maturin] features 再声明一次），含 CSPICE（经 CSPICE_DIR 指向
          # cspice-v1 release 预编译包，见上方下载步骤），提供 STM 传播/打靶等 Rust
          # 快速路径，署名见 NOTICE。故 args 无需再显式 --features spice。
          args: --release --out dist
          manylinux: 2_28
          before-script-linux: |
            set -eux
            # cspice-sys 的 CSPICE_DIR 指向预编译包后跳过 NAIF 下载；无需
            # openssl.pc（bindgen 在容器内编译 cspice C 头仍需 libclang.so，
            # AlmaLinux 8 包名 clang-libs）。export 对同一容器内的 maturin
            # 构建生效。
            export CSPICE_DIR="$(python3 scripts/download_cspice.py --print-cspice-dir)"
            yum install -y openssl-devel clang-libs clang
      - name: Build sdist
        if: matrix.os == 'ubuntu-24.04'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Ensure license files in sdist
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          # maturin sdist 不含仓库根目录的 LICENSE/NOTICE（cargo package 只打包
          # crate 目录内的文件），但 PKG-INFO 自动声明了 License-File，PyPI 会拒绝。
          SDIST=$(ls dist/e2m2e-*.tar.gz)
          mkdir -p /tmp/sdist-fix
          tar xzf "$SDIST" -C /tmp/sdist-fix
          SDIST_DIR=$(ls -d /tmp/sdist-fix/e2m2e-*/)
          cp LICENSE NOTICE "$SDIST_DIR"
          tar czf "$SDIST" -C /tmp/sdist-fix "$(basename "$SDIST_DIR")"
          rm -rf /tmp/sdist-fix
      - shell: bash
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
