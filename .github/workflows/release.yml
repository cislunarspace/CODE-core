name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  build:
    needs: lint
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Windows runner 上 Microsoft Store 的 python3 存根（App Execution Alias）
      # 会抢先解析到 WindowsApps\python3.EXE，maturin 探 Python 解释器时撞
      # EACCES。锁定 setup-python 装到的真实解释器并前置到 PATH。
      - name: Pin real Python on PATH (windows MS Store stub workaround)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $realPy = (py -3 -c "import sys; print(sys.executable)")
          Write-Host "Real Python: $realPy"
          "python=$realPy" | Out-File -Append $env:GITHUB_ENV
          $dir = Split-Path $realPy
          $env:Path = "$dir;$env:Path"
          "PATH=$dir;$env:Path" | Out-File -Append $env:GITHUB_ENV
      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PY_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != pyproject.toml version ($PY_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
      # manylinux 2014 (CentOS 7) 的 openssl 1.0.2 没有 openssl.pc；
      # cspice-sys 1.0.4 的 downloadcspice 走 reqwest→native-tls→openssl-sys，
      # 找不到 pkg-config 文件而失败。manylinux_2_28 镜像自带 openssl 1.1.1
      # 与 openssl-devel（含 openssl.pc），加上 before-script 兜底安装。
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          # spice feature：内含 CSPICE（经 cspice-sys downloadcspice 从 NAIF
          # 下载源码编译），提供 STM 传播/打靶等 Rust 快速路径，署名见 NOTICE
          args: --release --out dist --features spice
          manylinux: 2_28
          before-script-linux: |
            set -eux
            yum install -y openssl-devel
      - name: Build sdist
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Ensure license files in sdist
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # maturin sdist 不含仓库根目录的 LICENSE/AUTHORS.md（cargo package 只打包
          # crate 目录内的文件），但 PKG-INFO 自动声明了 License-File，PyPI 会拒绝。
          SDIST=$(ls dist/e2m2e-*.tar.gz)
          mkdir -p /tmp/sdist-fix
          tar xzf "$SDIST" -C /tmp/sdist-fix
          SDIST_DIR=$(ls -d /tmp/sdist-fix/e2m2e-*/)
          cp LICENSE AUTHORS.md NOTICE "$SDIST_DIR"
          tar czf "$SDIST" -C /tmp/sdist-fix "$(basename "$SDIST_DIR")"
          rm -rf /tmp/sdist-fix
      - shell: bash
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
