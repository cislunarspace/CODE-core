name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # 只装文档工具链，绝不安装 e2m2e 本体：构建机无 Rust 工具链与 CSPICE，
      # conf.py 已保证不 import 包（版本读 pyproject.toml，API 由 autoapi 静态
      # 解析源码生成）。uv venv 用 .python-version 钉住的 Python 3.13。
      - run: |
          uv venv
          uv pip install sphinx myst-parser sphinx-autoapi
      # 与 make docs 完全一致：-W 零告警门禁
      - run: uv run --no-sync python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
