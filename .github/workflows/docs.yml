name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "e2m2e/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: astral-sh/setup-uv@v7
      # conf.py 导入 e2m2e 取版本号，autodoc 也要导入包，需构建 Rust 扩展；
      # downloadcspice 已禁用（a80dbd8），构建前须先下 CSPICE 编译包并设 CSPICE_DIR
      - name: 恢复 SPICE 编译包缓存
        id: cache-cspice
        uses: actions/cache@v6
        with:
          path: .cspice
          key: cspice-${{ runner.os }}-v1
      - name: 下载 SPICE 编译包（cspice-v1 release；缓存命中则跳过）
        # --no-sync：脚本只用标准库（urllib/zipfile），避免 uv run 先触发
        # uv sync 构建扩展——此时 CSPICE_DIR 尚未设置，构建会直接报错（鸡生蛋）
        run: uv run --no-sync python scripts/download_cspice.py >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # cargo 编译缓存：docs 构建需编译 Rust 扩展（conf.py import e2m2e），
      # 全量约 50s → 增量。CSPICE_DIR 入 key 防缓存串味。
      - uses: Swatinem/rust-cache@v2
        with:
          env-vars: CSPICE_DIR
      - run: uv sync --group docs
      - run: uv run sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
