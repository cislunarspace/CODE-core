name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
      # spice 为默认 feature（crates/*/Cargo.toml default=["spice"]）：cargo fmt
      # 不编译、无需 CSPICE；cargo clippy 编译 spice 代码，须先下 CSPICE 编译包
      # 并设 CSPICE_DIR（cspice-v1 release，cspice-sys 据此跳过国内不可达的 NAIF 下载）。
      - run: cargo fmt --all -- --check
      - name: 下载 SPICE 编译包（cspice-v1 release）
        run: uv run python scripts/download_cspice.py >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --workspace -- -D warnings
      # Python 格式与风格
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 五层依赖方向检查（ADR 0012）：data/algorithm/api 无越层 import
      - run: uv run python scripts/check_layer_imports.py


  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev
      - run: uv run mypy e2m2e/ --ignore-missing-imports
