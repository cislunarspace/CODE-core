[workspace]
resolver = "2"
members = [
    "crates/e2m2e-integrators",
    "crates/e2m2e-propagation",
    "crates/e2m2e-forces",
    "crates/e2m2e-spice",
]

[workspace.package]
version = "5.6.7"
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/cislunarspace/e2m2e"
repository = "https://github.com/cislunarspace/e2m2e"

[workspace.dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
cspice = "0.1"
# CSPICE 一律经 scripts/download_cspice.py 提供（CSPICE_DIR，GitHub cspice-v1 release
# 预编译包）。不启用 cspice-sys 的 downloadcspice feature：无 CSPICE_DIR 时构建直接
# 报错并提示设 CSPICE_DIR，而非静默走 NAIF 官网源码下载（国内常不可达、构建超时）。
cspice-sys = "1.0"
# 多重打靶段积分并行（段间相互独立，rayon par_iter 线性加速）
rayon = "1.10"
# 转移网格搜索进度回调：Rust worker 跨线程发送完成信号给 FFI drainer 线程，
# drainer reacquire GIL 调 Python callable（Sender 为 Send+Sync，可被 rayon
# 多 worker 共享引用；std::sync::mpsc::Sender 是 !Sync，做不到）。
crossbeam-channel = "0.5"
