[workspace]
resolver = "2"
members = [
    "crates/e2m2e-integrators",
    "crates/e2m2e-propagation",
    "crates/e2m2e-forces",
    "crates/e2m2e-spice",
    "crates/e2m2e-levelset",
    "crates/e2m2e-hjb-dynamics",
]

[workspace.package]
version = "5.9.7"
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/cislunarspace/CODE-core"
repository = "https://github.com/cislunarspace/CODE-core"

[workspace.dependencies]
# extension-module 不在此处硬编码：该 feature 使 Linux 上所有构建目标
# （含 cargo test 的测试二进制）跳过链接 libpython，cargo test 报
# undefined symbol。由 e2m2e-integrators 的 "extension-module" feature
# 按目标启用（pyproject [tool.maturin] features 显式传入，仅 cdylib 构建）。
pyo3 = { version = "0.24", features = ["abi3-py310"] }
# cspice 绑定来自本组织独立维护的 hard fork（上游 jacob-pro 失修三年；
# 含 aarch64 E0606 修复与 LP64 SpiceInt 修复，见 ADR 0057）。三平台 CI 与
# aarch64 交叉检查：https://github.com/cislunarspace/cspice-rs
cspice-rs = { git = "https://github.com/cislunarspace/cspice-rs", tag = "v0.1.1" }
# CSPICE 一律经 scripts/download_cspice.py 提供（CSPICE_DIR，GitHub cspice-v1 release
# 预编译包）。不启用 cspice-rs-sys 的 downloadcspice feature：无 CSPICE_DIR 时构建直接
# 报错并提示设 CSPICE_DIR，而非静默走 NAIF 官网源码下载（国内常不可达、构建超时）。
cspice-rs-sys = { git = "https://github.com/cislunarspace/cspice-rs", tag = "v0.1.1" }
# 多重打靶段积分并行（段间相互独立，rayon par_iter 线性加速）
rayon = "1.10"
# 转移网格搜索进度回调：Rust worker 跨线程发送完成信号给 FFI drainer 线程，
# drainer reacquire GIL 调 Python callable（Sender 为 Send+Sync，可被 rayon
# 多 worker 共享引用；std::sync::mpsc::Sender 是 !Sync，做不到）。
crossbeam-channel = "0.5"
# 平面全周期 PAL 的秩揭示 SVD 与最小二乘；避免对秩亏问题使用正规方程。
nalgebra = "0.35"
# 中心流形频域 W 求解（#466）
rustfft = "6.4"
num-complex = "0.4"
# 水平集网格数据（e2m2e-levelset，任意维 n-d 数组是 ToolboxLS 移植的核心容器；
# 无 BLAS 后端即可满足有限差分模板运算）。
ndarray = "0.16"

