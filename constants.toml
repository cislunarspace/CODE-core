# 物理常数单一来源（single source of truth）。
#
# 本文件为 e2m2e 全库物理常数的唯一来源：
# - Python 侧 ``e2m2e.data.constants`` 运行期从本文件加载。
# - Rust 侧 ``e2m2e-propagation`` 构建期解析本文件，生成 ``constants.rs``
#   并通过 ``include!`` 引入。
#
# 所有数值单位统一为 km / s / kg 系；GM 单位为 km³/s²。

# -----------------------------------------------------------------------------
# 通用物理常量（全库一套）
# -----------------------------------------------------------------------------
[universal]
speed_of_light_kms = { value = 299792.458, source = "SI" }
gravitational_constant = { value = 6.67430e-20, source = "CODATA2018" }
au_km = { value = 149597870.7, source = "IAU2012" }
seconds_per_day = { value = 86400.0, source = "SI" }
earth_moon_distance_km = { value = 384405.0, source = "Cui2025" }
days_per_julian_year = { value = 365.25, source = "SI" }
days_per_julian_century = { value = 36525.0, source = "SI" }
km_to_m = { value = 1000.0, source = "SI" }
solar_flux_w_m2 = { value = 1367.0, source = "GMAT" }
solar_flux_tsi_w_m2 = { value = 1361.0, source = "Pesce2023" }
rad_per_deg = { value = 0.017453292519943295, source = "SI" }

